[build]
builder = "railpack"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @inkrelay/core build && pnpm --filter @inkrelay/db build && pnpm --filter @inkrelay/rendering build && pnpm --filter @inkrelay/worker build"

[deploy]
startCommand = "pnpm --filter @inkrelay/worker schedule"
cronSchedule = "*/15 * * * *"
restartPolicyType = "never"
