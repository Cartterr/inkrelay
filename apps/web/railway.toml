[build]
builder = "railpack"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @inkrelay/core build && pnpm --filter @inkrelay/db build && pnpm --filter @inkrelay/rendering build && pnpm --filter @inkrelay/web build"

[deploy]
preDeployCommand = ["pnpm --filter @inkrelay/db migrate"]
startCommand = "pnpm --filter @inkrelay/web start"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
